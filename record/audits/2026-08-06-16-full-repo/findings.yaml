      - slug: deprecated-serde-yaml-dev-dependency
        title: "bito-core tests depend on deprecated serde_yaml"
        criterion: "13.5"
        surface: "Dependency Fitness"
        concern: advisory
        locations:
          - path: Cargo.lock
            start_line: 1773
            end_line: 1776
        evidence: |2
          [[package]]
          name = "serde_yaml"
          version = "0.9.34+deprecated"
          source = "registry+https://github.com/rust-lang/crates.io-index"
        evidence_lang: toml
        evidence_markers:
          - lines: "2-3"
            type: mark
            label: "Dependency resolves to an explicitly deprecated release"
        mechanism: |
          bito-core directly declares `serde_yaml` as a development dependency and
          uses it in four configuration tests. Cargo.lock resolves that declaration
          to the explicitly deprecated 0.9.34+deprecated release, while the workspace
          lock already contains serde-saphyr through librebar. Keeping the deprecated
          parser preserves an avoidable maintenance and test-build dependency.
        remediation: |
          Replace the bito-core test dependency and its four `from_str` calls with
          serde-saphyr's compatible deserialization API, then regenerate the lockfile
          through the project's dependency workflow.
