---
audit_date: 2026-08-06
scope: "Full repository — source, dependencies, configuration, documentation, and CI"
commit: 13e912785aa0f70da28e9a4d7b7fb880dfd4aca5
assessment: |
  Bito has a disciplined Rust baseline: Clippy and RustSec are clean, cargo-deny
  passes, the workspace contains no unsafe application code, and the async surface
  has no demonstrated concurrency hazard. The material risk is contract drift at
  the user boundary. Several advertised quality gates do not gate, documented APIs
  and backends do not match their implementation, and randomized tie ordering breaks
  the same-input/same-result promise. One user-controlled UTF-8 path can panic, while
  error erasure and repeated tokenization weaken reliability and efficiency. The
  foundation is sound, but the public contract needs to be brought back into line
  with the code before the tool can be called fully deterministic.

