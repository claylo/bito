              for (idx, sentence) in sentences.iter().enumerate() {
                  let s_words = text::extract_words(sentence);
                  if s_words.is_empty() {
                      continue;
                  }
                  let glue = s_words
                      .iter()
                      .filter(|w| GLUE_WORDS.contains(w.as_str()))
