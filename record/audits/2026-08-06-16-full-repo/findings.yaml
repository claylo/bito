  - slug: documented-capabilities
    title: "The Documented Capability Surface"
    thesis: "Three shipped interfaces advertise concrete behavior that the current implementation either removed, renamed, or never wired."
    verdict: "These are contract failures rather than missing niceties. The configuration example does not compile, the OpenAI backend counts with a different vocabulary than documented, and an accepted configuration key is a silent no-op. Code compatibility or explicit migration documentation is required; silently accepting drift is the wrong posture for a quality-gate tool."
    findings:
      - slug: documented-config-loader-is-unreachable
        title: "The documented ConfigLoader API no longer exists"
        criterion: "FC-1"
        surface: "Completeness"
        concern: significant
        locations:
          - path: README.md
            start_line: 349
            end_line: 358
          - path: crates/bito-core/src/config.rs
            start_line: 302
            end_line: 329
        evidence: |2
          The `ConfigLoader` provides flexible configuration discovery:

          ```rust
          use bito_core::config::ConfigLoader;

          let config = ConfigLoader::new()
              .with_project_search(std::env::current_dir()?)
              .with_user_config(true)
              .load()?;
          ```
        evidence_lang: markdown
        evidence_markers:
          - lines: "4-9"
            type: del
            label: "This import and builder chain do not compile"
        mechanism: |
          The librebar migration removed the public
          `bito_core::config::ConfigLoader` type and replaced it with the fixed
          `bito_core::config::load(cwd, explicit)` function. The README still presents
          the removed builder as the library configuration API, so a developer
          following the authoritative example fails at import resolution before any
          configuration can be loaded.
        remediation: |
          Restore a compatibility `ConfigLoader` facade with the documented
          zero-argument constructor and builder operations, delegating internally to
          librebar. Preserve `load` as the simple entry point and document a
          deprecation path if the facade is transitional.
        temporal:
          introduced: 2026-08-06
          last_modified: 2026-08-06
          commit_count: 8
          monthly_commits: [0, 0, 0, 0, 0, 3, 3, 1, 0, 0, 0, 1]
        chains:
          enables: []
          enabled_by: []
          related: []
        effort: medium
        effort_notes: "The documented builder contract needs a compatibility wrapper and compile-tested documentation."

